# ==========================================================================
# PIPELINE MICROBEXPLORER
# Configuration file (YAML format)
# Author  : Yann Le Bihan
# Date    : 2026-09-03
# Link    : https://github.com/Yann-LBH/MicrobExplorer
#
# extensions used as input:
#  reads    : kaijuNR
#  contigs  : tsv
#  bakta    : gff3
# ==========================================================================

# ==========================================================================
# PIPELINE CONFIGURATION - Change these parameters to customize the pipeline
# ==========================================================================

language: "en" # english (en) or français (fr)

# --- MODULES ACTIFS ---
# Choose True/False | False by default

run_physico:                  False
# Data
run_reads:                    True
run_contigs:                  True
run_kegg:                     True
# Plots | auto detection of analysis selected
run_stackedbarplot_abundance: True
run_stackedbarplot_deseq2:    True
run_heatmap_abundance:        False
run_heatmap_deseq2:           True
run_pca:                      False
run_volcano:                  False
# Analysis
run_permanova:                True
run_deseq2:                   True
run_phyloseq:                 True
# More features
run_taxonomy:                 False
run_qc:                       False
run_shiny:                    False
run_benchmarks:               False

# DATA TYPES CONFIGURATION

datatypes:
  # Plots
  stackedbarplot:
    abundance:
      pathway_relative: ["kegg"]
      relative_by_sample: ["reads", "contigs"]
      absolute_global: ["reads", "contigs"]
    deseq2:    ["contigs", "kegg"]
  heatmap:
    abundance: ["reads", "contigs"]
    deseq2: ["kegg"]
  volcano: ["contigs", "kegg"]
  pca: ["reads", "contigs", "kegg"]
  # Analysis
  permanova: ["reads", "contigs", "kegg"]
  deseq2: ["contigs", "kegg"]
  phyloseq: ["reads","contigs", "kegg"]
  # More features
  qc: ["reads", "contigs", "kegg"]


# TREATEMENT PARAMETERS

reads:
  count_threshold: 10
  noise: 
    - "root"
    - "cellular organisms"
    - "unclassified"
    - "Bacteriophage sp."
    - "Duplodnaviria"
    - "environmental Halophage eHP-30"
    - "Methanobacterium virus PhiF1"
    - "Prokaryotic dsDNA virus sp."
    - "Riboviria"
    - "uncultured virus"
    - "Virus NIOZ-UU157"
    - "Viruses"

contigs:
  length_threshold: 3000
  abundance_threshold: 100
  rpkm_threshold: 0.5

kegg:
  pvalue_threshold : 0.05
  lfc_threshold : 1.3


# ANALYSIS PARAMETERS

permanova:
  effect : ["name", "date"]
  distance_method: "euclidean" # Options: "bray", "euclidean", "maximum", "manhattan", "canberra", "binary", "minkowski"
  use_clr: True # Options: True, False | Will always use euclidean if True
  permutation: 999

# DESeq2 contrasts to generate
# Change this list to use only the contrasts you need
deseq2:
  contrast: ["ref", "date", "combo"]  # Options: "ref", "date", "combo"
  ref: "TD1" # enter your key ref, it will use all sample with this key as ref
  sizefactor: "poscounts" # Options: "poscounts", "ratio", "iterate"
  test: "Wald" # Options: "Wald", "LRT"
  fittype: "parametric" # Options: "parametric", "local", "mean"

phyloseq:
  rank: ["gene_description", "level_3"] # ko, pathway

plots:
# General Settings - Native Scale Format, A4 (7 x 5.5)
  shared:
    theme: "theme_minimal"
    palette: "turbo"
    pdf_size: [7, 5.5] # [width, height]
    title_size: 12
    subtitle_size: 10
    axes_title_size: 9.5
    axes_tick_size: 8
    legend_title_size: 8.5
    legend_size: 8
    # Specific Elements
    heatmap_label_size: 6.5
    dendrogram_line_width: 0.6
    pca_point_size: 2.0
    pca_label_size: 3.0
    stroke_width: 0.5
    rank:
      reads: "species" #eg : "domain", "kingdom", "phylum", class", "order", "family", "genus", "species"
      contigs: "species" #eg : "domain", "phylum", class", "order", "family", "genus", "species"
      kegg: ["level_3", "gene_description"]

# Plots
  barplot:
    top_n: 19

  stackedbarplot_abundance:
    top_n: 10

  stackedbarplot_deseq2:
    #title: "{source} | Top {top_n} {feature_type} differentially abundant in {contrast}"
    #subtitle: "Pvalue threshold : {padj_threshold} | Log2 Fold Change threshold : {lfc_threshold} | {rank}"
    top_n: 10
    contrasts_values: # use the same order as your contrasts OPTIONS: "ref", "date", "combo"
      padj_threshold : ["0.01", "0.001", "0.01"]
      lfc_threshold : ["1.3", "1.3", "1.3"]

  heatmap:
    #title: "{source} | Abundance of the top {top_n} taxons in sample {sample}"
    #subtitle: "Hierarchical clustering: {clust_method} | Distance metric: {distance_method} | {rank}"
    top_n: 50
    clust_method: "ward.D2" # Options: "ward.D", "ward.D2", "single", "complete", "average", "mcquitty", "median", "centroid"
    distance_method: "bray" # Options: "euclidean", "maximum", "manhattan", "canberra", "binary", "minkowski"

  heatmap_deseq2:
    top_n: 25
    group_by: "date" # Options : "name" or "date"
    clust_method: "ward.D2" # Options: "ward.D", "ward.D2", "single", "complete", "average", "mcquitty", "median", "centroid"
    distance_method: "bray" # Options: "euclidean", "maximum", "manhattan", "canberra", "binary", "minkowski"
    contrasts_values: # use the same order as your contrasts OPTIONS: "ref", "date", "combo"
      padj_threshold : ["0.01", "0.001", "0.01"]
      lfc_threshold : ["1.3", "1.3", "1.3"]
  
  pca:
    #title: "{source} | Principal Component Analysis (PCA) — {top_n} Most Variable Taxa"
    #subtitle: "Ordination based on CLR distance | DIMENSION {dim_x} vs DIMENSION {dim_y} | {rank}"
    top_n: 10
    dim_x: 1
    dim_y: 2
    physico_col: "pH" # use any parameters from the physico_parameters file
    point_size: 2

  volcano:
    #title: "{source} | Top {top_n} Differential Abundance Volcano Plot in {contrast}"
    #subtitle: "Pvalue threshold : {padj_threshold} | Log2 Fold Change threshold : {lfc_threshold} | {rank}"
    top_n: 10
    contrasts_values: # use the same order as your contrasts OPTIONS: "ref", "date", "combo"
      padj_threshold : ["0.01", "0.001", "0.01"]
      lfc_threshold : ["1.3", "1.3", "1.3"]

# ==========================================================================
# DATA PATH - Do not modify
# ==========================================================================
samples_file: "config/samples.tsv"
title_resolver: "config/i18n.json"

input_path:
  data_raw: 
    reads: "data/raw/reads/"
    contigs: "data/raw/contigs/"
    kegg: "data/raw/kegg/"
  metadata: "data/metadata/metadata.xlsx"
  taxonomy_ncbi: 
    zip_url: "https://ftp.ncbi.nlm.nih.gov/pub/taxonomy/new_taxdump/new_taxdump.zip"
    dmp_name: "data/taxonomy_ncbi/new_taxdump.zip/rankedlineage.dmp"
    local_path: "data/taxonomy_ncbi/taxaname.tsv"
  taxonomy_megahit:
    original: "data/taxonomy_megahit/contigs_coassembly-taxNames.tsv"
    converted: "data/taxonomy_megahit/taxaname.tsv"
  pathway_bakta: 
    url : "https://rest.kegg.jp/get/br:ko00001"
    local_path: "data/pathway_bakta/pathway.tsv"
  physico_params: "data/physico_parameters/parameters.xlsx"

output_path:
  treatment: "results/treatment/"
  plots: "results/plots/"
  permanova: "results/permanova/"
  rds: "results/rds/"
  parquet: "results/parquet/"
  qc: "results/qc/"
  audit: "results/audit/final_MicrobExplorer_audit.html"
# ==========================================================================